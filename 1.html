<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 나의 도서관 </title>

    <link rel="stylesheet" href="style.css">
  </head>


  <!--  바디부분 -->
<body>
  <header>
    <h1>
      나의 작은도서관
    </h1>
    <p> HTML, CSS, JavScript 연습 </p>
  </header>




  <!-- 메뉴영역 -->
  <nav>
    <a href="#home"> 홈</a>
    <a href="#books"> 도서목록</a>
    <a href="#">도서등록</a>
  </nav>


  <!-- 메인 -->
  <main>

    <!-- 부모요소: css에서 flex적용-->
     <div class="content">
     
      <!-- 왼쪽영역 -->
        <div class="left"> 

          <section id="home">
            <h2> 도서검색 </h2>
            <form id="searchForm">
              <label for="search">도서명</label>
              <input
                    type="text"
                    id="search"
                    name="keyword"
                    placeholder="책 제목 입력"
                    required
              >
              <button type="submit">
                검색
              </button>
            </form>

            <!-- Javascript 결과출력-->
            <p id="result"></p>

          </section>

          <!-- section 2 추천도서 -->
          <section id="books">
            <h2> 추천도서 </h2>
            <!-- 독립콘텐츠 article-->
             <article class="book">
              <h2> 도서 검색</h2>
              <h3>html 기초</h3>
              <p>저자: 신태현</p>
              <p>HTML의 기본구조를 배우는 책</p>
             </article>
             <article class="book">
              <h3>CSS 기초</h3>
              <p>저자: 신태현</p>
              <p>CSS의 기본구조를 배우는 책</p>
             </article>
          </section>
        </div>

        <!--오른쪽영역 aside-->
          <aside>
            <h2> 공지사항</h2>
            <p> 운영시간:9:00~20:00</p>
            <p> 일요일 휴관</p>
            <h3> 인기도서 </h3>

            <ul>
              <li> html기초</li>
                            <li> css기초</li>
                                          <li> JS기초</li>


            </ul>
          </aside>



     </div>
  

  </main>

  <footer>
    <p> 오픈소스스튜디오 중간고사 </p>
  </footer>

  <script src="script.js"></script>



</body>






</html>
